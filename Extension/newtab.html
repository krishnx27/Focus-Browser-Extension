<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusBoard</title>
  <!-- Google Fonts: Cormorant Garamond & DM Sans / Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <!-- Full coverage wallpaper background -->
  <div id="wallpaper-background" class="wallpaper-background"></div>
  <!-- Dark semi-transparent overlay for readability -->
  <div class="overlay"></div>

  <!-- Pulse Shockwave Ring for Focus Mode (Task 4.2) -->
  <div id="pulse-shockwave" class="pulse-shockwave"></div>

  <!-- Locked In Toast Notification (Task 4.2) -->
  <div id="locked-in-toast" class="locked-in-toast" aria-live="assertive">
    <span>Locked In 🔒</span>
  </div>

  <!-- Top-Left Settings Gear Icon (Task 3.1) -->
  <header class="top-nav">
    <button id="settings-open-btn" class="settings-gear-btn" type="button" title="Settings" aria-label="Open Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <!-- Bottom-Left Focus Mode Toggle Widget (Task 4.2) -->
  <div class="bottom-left-controls">
    <div id="focus-mode-widget" class="focus-mode-widget">
      <span class="focus-mode-label">Focus Mode</span>
      <button
        id="focus-mode-toggle-btn"
        class="toggle-switch"
        type="button"
        role="switch"
        aria-checked="false"
        aria-label="Toggle Focus Mode"
      >
        <span class="toggle-slider"></span>
      </button>
      <span id="focus-mode-status" class="focus-mode-status">OFF</span>
    </div>
  </div>

  <!-- Main viewport container -->
  <main class="dashboard-container">
    <!-- Center Hero Section -->
    <section class="center-content" aria-label="Clock and Focus">
      <!-- Live Clock & Date -->
      <div class="clock-section">
        <h1 id="clock-time" class="clock-time" aria-live="polite">12:00</h1>
        <p id="date-display" class="date-display">Today</p>
      </div>

      <!-- Dynamic Greeting -->
      <h2 id="greeting-text" class="greeting-text" aria-live="polite">Good morning, Friend</h2>

      <!-- Daily Focus Section -->
      <div id="focus-container" class="focus-container">
        <!-- Input State (When no focus set for today) -->
        <div id="focus-input-view" class="focus-input-view">
          <label for="focus-input" class="focus-prompt">What is your main focus today?</label>
          <div class="focus-input-wrapper">
            <input
              type="text"
              id="focus-input"
              class="focus-input"
              maxlength="160"
              autocomplete="off"
              spellcheck="false"
              placeholder="e.g. Complete project proposal"
              aria-label="What is your main focus today?"
            />
          </div>
        </div>

        <!-- Display State (When focus is set) -->
        <div id="focus-display-view" class="focus-display-view hidden">
          <span class="focus-tag">TODAY'S FOCUS</span>
          <div class="focus-text-row">
            <p id="focus-text" class="focus-text"></p>
            <button
              id="focus-edit-btn"
              class="focus-edit-btn"
              type="button"
              title="Edit today's focus"
              aria-label="Edit today's focus"
            >
              <!-- Subtle pencil icon -->
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Phase 2: Task Panel Sidebar (Tasks 2.1, 2.2, 2.3) -->
  <aside id="task-sidebar" class="task-sidebar" aria-label="Tasks">
    <div class="task-header">
      <div class="task-title-row">
        <h3 class="task-title">Tasks</h3>
        <span id="task-counter" class="task-counter">0/0 done</span>
      </div>
    </div>

    <!-- Task Items Scrollable Container -->
    <div class="task-body">
      <div id="task-empty-state" class="task-empty-state">No tasks yet. Add one below</div>
      <ul id="task-list" class="task-list" aria-label="Task list"></ul>
    </div>

    <!-- Task Addition Form at the bottom -->
    <form id="task-form" class="task-form" autocomplete="off">
      <input
        type="text"
        id="task-input"
        class="task-input"
        maxlength="150"
        placeholder="Add a new task..."
        autocomplete="off"
        spellcheck="false"
        aria-label="Add a new task"
      />
    </form>
  </aside>

  <!-- Phase 3: Settings Modal (Tasks 3.1, 3.2, 3.3, 3.4) -->
  <div id="settings-modal" class="modal-backdrop hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="settings-title" class="modal-title">Settings</h2>
        <button id="settings-close-btn" class="modal-close-btn" type="button" aria-label="Close Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <!-- Section 1: User Profile (Task 3.2) -->
        <div class="settings-section">
          <label for="settings-name-input" class="settings-label">Your Name</label>
          <input
            type="text"
            id="settings-name-input"
            class="settings-input"
            placeholder="e.g. Krishna"
            maxlength="40"
            autocomplete="off"
          />
        </div>

        <!-- Section 2: Clock Format (Task 3.2) -->
        <div class="settings-section">
          <label class="settings-label">Clock Format</label>
          <div class="segmented-control" role="radiogroup" aria-label="Clock Format">
            <button id="clock-fmt-12h" class="segment-btn active" type="button" role="radio" aria-checked="true">12-Hour</button>
            <button id="clock-fmt-24h" class="segment-btn" type="button" role="radio" aria-checked="false">24-Hour</button>
          </div>
        </div>

        <!-- Section 3: Custom Wallpaper (Task 3.3) -->
        <div class="settings-section">
          <label class="settings-label">Wallpaper</label>
          <div class="wallpaper-actions-row">
            <input type="file" id="wallpaper-file-input" accept="image/jpeg,image/png,image/webp" style="display:none;" />
            <button id="upload-wallpaper-btn" class="settings-btn" type="button">
              Upload Custom Image
            </button>
            <button id="reset-wallpaper-btn" class="settings-btn settings-btn-outline" type="button">
              Reset to Default
            </button>
          </div>
          <p class="settings-helper-text">Max file size: 5MB (JPEG, PNG, WebP)</p>
          <p id="wallpaper-status-msg" class="wallpaper-status-msg" aria-live="polite"></p>
        </div>

        <!-- Section 4: Blocked Sites (Task 3.4 & 4.4) -->
        <div class="settings-section">
          <div class="settings-section-header">
            <label class="settings-label">Focus Mode Blocked Sites</label>
            <span id="settings-focus-status-badge" class="settings-focus-badge">Focus Mode: OFF</span>
          </div>
          <form id="add-site-form" class="add-site-form" autocomplete="off">
            <input
              type="text"
              id="blocked-site-input"
              class="settings-input"
              placeholder="e.g. twitter.com"
              autocomplete="off"
            />
            <button id="add-site-btn" class="settings-btn" type="submit">Add</button>
          </form>
          <p class="settings-helper-text">Enter domains without http/https. Subdomains are blocked automatically when Focus Mode is ON.</p>
          
          <ul id="blocked-sites-list" class="blocked-chips-list" aria-label="Blocked domains list"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="settings.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
